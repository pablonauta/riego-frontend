<div class="foto-card">
  <h3>Última imagen</h3>

  <p *ngIf="cargando()">Cargando…</p>
  <p class="error" *ngIf="error()">{{ error() }}</p>

  <img
    *ngIf="foto() as f"
    [src]="f.url"
    alt="Última captura"
  />

  <small *ngIf="foto() as f">
    {{ f.ts | date:'short' }}
  </small>
</div>
