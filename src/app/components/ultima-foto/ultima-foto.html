<div class="wrap">

  <h3>
    {{ tipo === 'JIELI' ? 'Cámara Jieli' : 'Cámara Pixart' }}
  </h3>

  <div *ngIf="cargando() && !imgSrc()">
    Cargando fotografía...
  </div>

  <div class="error" *ngIf="error()">
    {{ error() }}
  </div>

  <img
    *ngIf="imgSrc()"
    [src]="imgSrc()!"
    [alt]="'Fotografía de ' + tipo"
  />

  <div *ngIf="foto()" class="fecha-foto">
    Última captura:
    <strong>
      {{ foto()!.ts | date:'dd/MM/yyyy HH:mm:ss' }}
    </strong>
  </div>

  <button
  type="button"
  [attr.aria-expanded]="mostrarHistorial()"
  (click)="mostrarHistorial.set(!mostrarHistorial())">
  {{ mostrarHistorial() ? 'Cerrar historial' : 'Ver historial' }}
</button>

@if (mostrarHistorial()) {
  <app-historial-fotos
    [instalacionId]="instalacionId"
    [tipo]="tipo">
  </app-historial-fotos>
}

</div>
