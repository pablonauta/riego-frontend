<div class="dashboard-container">

  <!-- HEADER -->
  <div class="dashboard-header">
    <h1>Panel del sistema de riego</h1>
    <app-logout></app-logout>
  </div>

  <p *ngIf="email">
    Iniciaste sesión con: <strong>{{ email }}</strong>
  </p>

  <!-- Navegación -->
  <nav class="dashboard-nav">
    <a routerLink="/dashboard">
      Inicio
    </a>

    <a *ngIf="esAdmin" routerLink="/dashboard/usuarios">
      Administrar usuarios
    </a>

    <a *ngIf="puedeVerElectrovalvulas" routerLink="/dashboard/electrovalvulas">
      Electroválvulas
    </a>
    <button type="button" class="selector-tema"
      [attr.aria-pressed]="tema.tema() === 'oscuro'"
      (click)="tema.alternar()">
      Modo oscuro
    </button>
  </nav>

  <!-- Rutas hijas -->
  <router-outlet></router-outlet>

</div>
